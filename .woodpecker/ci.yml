# Woodpecker CI — fallback / manual mirror of .github/workflows/ci.yml
#
# Triggered only via the Woodpecker UI ("Run pipeline"). GitHub Actions remains
# the primary CI; this exists so the same validations can be re-run from
# Woodpecker when needed (e.g., GHA outage, self-hosted verification).
#
# To run: open the repo in Woodpecker → Manual → select branch → Run.

when:
  - event: manual

steps:
  validate:
    image: node:20-bookworm
    commands:
      - apt-get update -qq && apt-get install -y -qq --no-install-recommends jq git ca-certificates >/dev/null
      - git config --global --add safe.directory "$CI_WORKSPACE"

      # --- manifest.json ---
      - echo "==> manifest.json is valid JSON"
      - jq empty manifest.json

      - echo "==> manifest.json has required fields"
      - |
        for field in manifest_version name version description permissions background action icons; do
          if ! jq -e ".${field}" manifest.json > /dev/null; then
            echo "ERROR: manifest.json is missing required field: ${field}"
            exit 1
          fi
        done

      - echo "==> manifest_version is 3"
      - |
        MV=$(jq -r '.manifest_version' manifest.json)
        if [ "$MV" != "3" ]; then
          echo "ERROR: manifest_version must be 3, got ${MV}"
          exit 1
        fi

      - echo "==> version is semver-shaped"
      - |
        VER=$(jq -r '.version' manifest.json)
        if ! echo "$VER" | grep -Eq '^[0-9]+(\.[0-9]+){1,3}$'; then
          echo "ERROR: version '${VER}' is not a valid Chrome extension version (1-4 dot-separated integers)"
          exit 1
        fi

      # --- manifest.firefox.json ---
      - echo "==> manifest.firefox.json is valid JSON"
      - jq empty manifest.firefox.json

      - echo "==> manifest.firefox.json has required fields"
      - |
        for field in manifest_version name version description permissions background action icons browser_specific_settings; do
          if ! jq -e ".${field}" manifest.firefox.json > /dev/null; then
            echo "ERROR: manifest.firefox.json is missing required field: ${field}"
            exit 1
          fi
        done

      - echo "==> manifest.firefox.json uses background.scripts (not service_worker)"
      - |
        if jq -e '.background.service_worker' manifest.firefox.json > /dev/null 2>&1; then
          echo "ERROR: manifest.firefox.json must use background.scripts, not service_worker"
          exit 1
        fi
        if ! jq -e '.background.scripts' manifest.firefox.json > /dev/null; then
          echo "ERROR: manifest.firefox.json must declare background.scripts"
          exit 1
        fi

      - echo "==> Chromium and Firefox manifests share the same version"
      - |
        V_CHROME=$(jq -r '.version' manifest.json)
        V_FIREFOX=$(jq -r '.version' manifest.firefox.json)
        if [ "$V_CHROME" != "$V_FIREFOX" ]; then
          echo "ERROR: Version mismatch: manifest.json=${V_CHROME}, manifest.firefox.json=${V_FIREFOX}"
          exit 1
        fi

      - echo "==> All required icons exist"
      - |
        for size in 16 32 48 128; do
          test -f "icons/icon${size}.png" || { echo "ERROR: Missing icons/icon${size}.png"; exit 1; }
        done

      - echo "==> background.js parses as JavaScript"
      - node --check background.js

      - echo "==> lib/*.js parses as JavaScript"
      - |
        for f in lib/*.js; do
          [ -f "$f" ] || continue
          node --check "$f"
        done

      - echo "==> Run unit tests (vitest)"
      - |
        if [ -f package.json ]; then
          npm install --no-audit --no-fund --silent
          npm test
        fi

      - echo "==> No AI-assistant attribution in commit history (last 50)"
      - |
        BAD=$(git log -n 50 --pretty=format:'AUTHOR:%an <%ae>%nCOMMITTER:%cn <%ce>%nMESSAGE:%B%n---' \
          | sed -E 's#\.?[Cc][Ll][Aa][Uu][Dd][Ee](\.md|/)##g' \
          | grep -iE '\b(claude|anthropic|copilot|chatgpt|cursor)\b|generated with claude|🤖 generated|co-authored-by:[[:space:]]*(claude|copilot|chatgpt|cursor|anthropic)' || true)
        if [ -n "$BAD" ]; then
          echo "ERROR: Commit history contains AI-assistant attribution. See the project guidance file."
          echo "$BAD"
          exit 1
        fi

      - echo "==> Conventional Commits check (last 20 commits)"
      - |
        BAD_SUBJECTS=$(git log -n 20 --pretty=format:'%s' \
          | grep -vE '^(feat|fix|perf|refactor|docs|test|chore|ci|build|style|revert)(\([^)]+\))?!?:[[:space:]].+' \
          | grep -v '^Merge ' || true)
        if [ -n "$BAD_SUBJECTS" ]; then
          echo "ERROR: These commit subjects don't follow Conventional Commits format (type[!]: description):"
          echo "$BAD_SUBJECTS"
          echo ""
          echo "Allowed types: feat, fix, perf, refactor, docs, test, chore, ci, build, style, revert"
          exit 1
        fi
